</head><body class="bg-surface-container pt-safe pb-safe min-h-screen flex flex-col items-center justify-center"><main class="w-full flex-1 flex flex-col"><div class="flex flex-col w-full h-full min-h-[707px] px-margin justify-center bg-surface-container items-center relative overflow-hidden">
<!-- Decorative background elements to add "Transparent Empathy" softness -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-primary-container opacity-20 rounded-full blur-3xl mix-blend-screen pointer-events-none"></div>
<div class="absolute bottom-[-5%] right-[-10%] w-72 h-72 bg-secondary-container opacity-20 rounded-full blur-3xl mix-blend-screen pointer-events-none"></div>
<div class="w-full max-w-md flex flex-col items-center relative z-10 animate-fade-in-up">
<!-- Logo Placeholder -->
<div class="mb-lg w-24 h-24 rounded-2xl bg-surface flex items-center justify-center shadow-sm relative overflow-hidden group cursor-pointer transition-transform duration-300 hover:scale-105">
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="material-symbols-outlined text-[48px] text-primary transition-transform duration-500 group-hover:rotate-12 group-hover:scale-110">volunteer_activism</span>
</div>
<!-- Title & Subtitle -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-text-primary mb-xs tracking-tight">Faça parte da mudança</h1>
<p class="font-body-md text-body-md text-text-secondary max-w-[280px] mx-auto">Junte-se à nossa comunidade de empatia e ação.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md" onsubmit="event.preventDefault(); animateLogin(this);">
<!-- Email Input -->
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-text-secondary ml-xs transition-colors group-focus-within:text-primary" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-text-secondary group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-12 pl-10 pr-sm bg-surface border border-border rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-secondary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" placeholder="seu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs group">
<div class="flex justify-between items-center ml-xs mr-xs">
<label class="font-label-sm text-label-sm text-text-secondary transition-colors group-focus-within:text-primary" for="password">Senha</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Esqueceu sua senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-text-secondary group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-12 pl-10 pr-10 bg-surface border border-border rounded-lg font-body-md text-body-md text-text-primary placeholder:text-text-secondary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary transition-colors focus:outline-none rounded-full p-1 hover:bg-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-xs w-full h-12 bg-primary-container hover:bg-primary text-on-primary-container hover:text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:shadow-md transition-all duration-300 flex items-center justify-center relative overflow-hidden group" id="submit-btn" type="submit">
<span class="relative z-10 flex items-center gap-2 group-hover:gap-3 transition-all">
          Entrar
          <span class="material-symbols-outlined text-[18px] opacity-0 -ml-4 group-hover:opacity-100 group-hover:ml-0 transition-all duration-300">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
<!-- Loading spinner (hidden by default) -->
<span class="material-symbols-outlined absolute inset-0 m-auto animate-spin hidden text-on-primary-container text-[24px]" id="loading-spinner">progress_activity</span>
</button>
</form>
<!-- Sign up Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-text-secondary">
        Ainda não faz parte? 
        <a class="font-label-md text-label-md text-primary hover:text-primary-container underline underline-offset-4 decoration-primary/30 hover:decoration-primary transition-all ml-1" href="#">
          Cadastre-se
        </a>
</p>

</div>
</div>
<style>
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
<script>
  function togglePassword() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('visibility-icon');
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  function animateLogin(form) {
    const btn = document.getElementById('submit-btn');
    const spinner = document.getElementById('loading-spinner');
    const btnText = btn.querySelector('span.relative');
    
    // Disable form
    btn.disabled = true;
    form.querySelectorAll('input').forEach(input => input.disabled = true);
    
    // Show loading state
    btnText.style.opacity = '0';
    spinner.classList.remove('hidden');
    
    // Simulate API call for delight moment
    setTimeout(() => {
      // Success state
      btn.classList.remove('bg-primary-container', 'hover:bg-primary');
      btn.classList.add('bg-secondary', 'text-on-secondary');
      spinner.classList.add('hidden');
      spinner.textContent = 'check_circle';
      spinner.classList.remove('animate-spin');
      spinner.classList.remove('hidden');
      
      // Add a subtle success pop animation to the form container
      form.closest('.max-w-md').style.transform = 'scale(1.02)';
      form.closest('.max-w-md').style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      
      setTimeout(() => {
         form.closest('.max-w-md').style.transform = 'scale(1)';
      }, 300);
      
    }, 1500);
  }
</script></main></body></html>
