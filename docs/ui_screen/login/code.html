<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#ffffff", "inverse-primary": "#a4c9ff", "on-tertiary-fixed-variant": "#633f00", "on-secondary-fixed": "#00201f", "primary": "#005da7", "primary-container": "#2976c7", "on-primary-fixed": "#001c39", "error-container": "#ffdad6", "surface-container-low": "#f0f3ff", "primary-fixed": "#d4e3ff", "tertiary": "#805200", "surface-container-lowest": "#ffffff", "on-secondary": "#ffffff", "on-secondary-container": "#00706d", "surface-dim": "#d0daf0", "secondary-container": "#74f7f1", "inverse-surface": "#273141", "secondary-fixed-dim": "#53dad5", "on-surface": "#121c2c", "inverse-on-surface": "#ebf1ff", "surface-container-high": "#dee8ff", "on-error-container": "#93000a", "on-primary": "#ffffff", "error": "#ba1a1a", "tertiary-container": "#a16900", "background": "#f9f9ff", "outline": "#717783", "primary-fixed-dim": "#a4c9ff", "surface-bright": "#f9f9ff", "on-tertiary-container": "#fffbff", "tertiary-fixed-dim": "#ffb955", "on-primary-container": "#fdfcff", "on-surface-variant": "#414751", "secondary": "#006a67", "surface-tint": "#0060ac", "on-background": "#121c2c", "outline-variant": "#c1c7d3", "surface-container": "#e7eeff", "secondary-fixed": "#74f7f1", "on-tertiary-fixed": "#291800", "on-primary-fixed-variant": "#004883", "tertiary-fixed": "#ffddb4", "surface-variant": "#d9e3f9", "on-secondary-fixed-variant": "#00504d", "surface": "#f9f9ff", "on-error": "#ffffff", "surface-container-highest": "#d9e3f9" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "16px", "lg": "24px", "base": "8px", "md": "16px", "xs": "4px", "sm": "12px", "container_margin": "20px", "xl": "32px" }, "fontFamily": { "display-lg": ["Nunito Sans"], "label-md": ["Nunito Sans"], "headline-sm": ["Nunito Sans"], "label-sm": ["Nunito Sans"], "body-md": ["Nunito Sans"], "headline-md": ["Nunito Sans"], "body-lg": ["Nunito Sans"] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-background pt-safe pb-safe min-h-screen flex flex-col items-center justify-center"><main class="w-full flex-1 flex flex-col"><div class="flex flex-col w-full h-full min-h-[707px] px-container_margin justify-center bg-background items-center relative overflow-hidden">
<!-- Decorative background elements to add "Transparent Empathy" softness -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-primary-container opacity-20 rounded-full blur-3xl mix-blend-multiply dark:mix-blend-screen pointer-events-none"></div>
<div class="absolute bottom-[-5%] right-[-10%] w-72 h-72 bg-secondary-container opacity-20 rounded-full blur-3xl mix-blend-multiply dark:mix-blend-screen pointer-events-none"></div>
<div class="w-full max-w-md flex flex-col items-center relative z-10 animate-fade-in-up">
<!-- Logo Placeholder -->
<div class="mb-lg w-24 h-24 rounded-2xl bg-surface-container-high flex items-center justify-center shadow-sm relative overflow-hidden group cursor-pointer transition-transform duration-300 hover:scale-105">
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="material-symbols-outlined text-[48px] text-primary transition-transform duration-500 group-hover:rotate-12 group-hover:scale-110">volunteer_activism</span>
</div>
<!-- Title & Subtitle -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-on-background mb-xs tracking-tight">Faça parte da mudança</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Junte-se à nossa comunidade de empatia e ação.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md" onsubmit="event.preventDefault(); animateLogin(this);">
<!-- Email Input -->
<div class="flex flex-col gap-xs group">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs transition-colors group-focus-within:text-primary" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-12 pl-10 pr-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" placeholder="seu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs group">
<div class="flex justify-between items-center ml-xs mr-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant transition-colors group-focus-within:text-primary" for="password">Senha</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Esqueceu sua senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-12 pl-10 pr-10 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors focus:outline-none rounded-full p-1 hover:bg-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-xs w-full h-12 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:shadow-md transition-all duration-300 flex items-center justify-center relative overflow-hidden group" id="submit-btn" type="submit">
<span class="relative z-10 flex items-center gap-2 group-hover:gap-3 transition-all">
          Entrar
          <span class="material-symbols-outlined text-[18px] opacity-0 -ml-4 group-hover:opacity-100 group-hover:ml-0 transition-all duration-300">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
<!-- Loading spinner (hidden by default) -->
<span class="material-symbols-outlined absolute inset-0 m-auto animate-spin hidden text-on-primary text-[24px]" id="loading-spinner">progress_activity</span>
</button>
</form>
<!-- Sign up Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        Ainda não faz parte? 
        <a class="font-label-md text-label-md text-primary hover:text-primary-container underline underline-offset-4 decoration-primary/30 hover:decoration-primary transition-all ml-1" href="#">
          Cadastre-se
        </a>
</p>
</div>
</div>
</div>
<style>
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
<script>
  function togglePassword() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('visibility-icon');
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  function animateLogin(form) {
    const btn = document.getElementById('submit-btn');
    const spinner = document.getElementById('loading-spinner');
    const btnText = btn.querySelector('span.relative');
    
    // Disable form
    btn.disabled = true;
    form.querySelectorAll('input').forEach(input => input.disabled = true);
    
    // Show loading state
    btnText.style.opacity = '0';
    spinner.classList.remove('hidden');
    
    // Simulate API call for delight moment
    setTimeout(() => {
      // Success state
      btn.classList.remove('bg-primary', 'hover:bg-primary-container');
      btn.classList.add('bg-secondary', 'text-on-secondary');
      spinner.classList.add('hidden');
      spinner.textContent = 'check_circle';
      spinner.classList.remove('animate-spin');
      spinner.classList.remove('hidden');
      
      // Add a subtle success pop animation to the form container
      form.closest('.max-w-md').style.transform = 'scale(1.02)';
      form.closest('.max-w-md').style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      
      setTimeout(() => {
         form.closest('.max-w-md').style.transform = 'scale(1)';
      }, 300);
      
    }, 1500);
  }
</script></main></body></html>
